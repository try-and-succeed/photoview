"A bounding box of where a face is present on an image. The values map from 0 to 1 as a fraction of the image width/height"
type FaceRectangle {
  minX: Float!
  maxX: Float!
  minY: Float!
  maxY: Float!
}

"How a face got into its current group"
enum FaceAssignment {
  "Placed by the face detector during a scan"
  DETECTOR
  "Moved or split off by a person"
  USER
  "Placed by an automatic re-identification run"
  RECLASSIFY
}

"Which faces of a group to list"
input ImageFaceFilter {
  verified: Boolean
  needsReview: Boolean
}

"A collection of faces of a particular person"
type FaceGroup {
  id: ID!
  "The name of the person"
  label: String
  imageFaces(paginate: Pagination, filter: ImageFaceFilter): [ImageFace!]!
  "The total number of images in this collection"
  imageFaceCount: Int!
  "Faces in this group confirmed by a person"
  verifiedFaceCount: Int!
  "Faces in this group waiting for review"
  reviewFaceCount: Int!
}

"A single face on a particular image"
type ImageFace {
  id: ID!
  "A reference to the image the face appears on"
  media: Media!
  "A bounding box of where on the image the face is present"
  rectangle: FaceRectangle!
  "The `FaceGroup` that contains this `ImageFace`"
  faceGroup: FaceGroup!
  "Confirmed by a person; never moved automatically"
  verified: Boolean!
  "Who put the face into its current group"
  assignedBy: FaceAssignment!
  "Placed or checked by an automatic run and not yet reviewed"
  needsReview: Boolean!
}

"One face an automatic run moved, or would move"
type FaceReassignment {
  imageFace: ImageFace!
  from: FaceGroup!
  "The group it moved to. A face without a match gets a new group of its own, which only exists after a real run, so this is null for those with dryRun"
  to: FaceGroup
}

"What reclassifyFaceGroups did, or would do with dryRun"
type ReclassifyResult {
  "Unverified faces looked at"
  checked: Int!
  "Stayed in their group"
  kept: Int!
  "Moved to another group"
  moved: Int!
  "No verified face close enough; each got a new group of its own"
  unmatched: Int!
  "Would have moved, but the destination already has a face on that photo"
  conflicts: Int!
  "Verified faces used as reference"
  verifiedSamples: Int!
  "Faces that changed group, or would change with dryRun"
  changes: [FaceReassignment!]!
}

extend type Query {
  """
  Get a list of `FaceGroup`s for the logged in user, named before unnamed, then by the
  number of photos. `countDirection` turns the count round (default DESC); ties are
  broken by id ascending in either direction, so paging is stable.
  """
  myFaceGroups(paginate: Pagination, countDirection: OrderDirection = DESC): [FaceGroup!]! @isAuthorized

  "Get a particular `FaceGroup` specified by its ID"
  faceGroup(id: ID!): FaceGroup! @isAuthorized

  "Photos with at least one face waiting for review, newest first; optionally only those of one group"
  myMediaNeedingReview(faceGroupID: ID, paginate: Pagination): [Media!]! @isAuthorized
}

extend type Mutation {
  "Assign a label to a face group, set label to null to remove the current one"
  setFaceGroupLabel(faceGroupID: ID!, label: String): FaceGroup! @isAuthorized

  "Merge two face groups into a single one, all ImageFaces from source will be moved to destination"
  combineFaceGroups(destinationFaceGroupID: ID!, sourceFaceGroupIDs: [ID!]!): FaceGroup! @isAuthorized

  """
  Move a list of ImageFaces to another face group. It fails when the group
  would then hold two faces on one of the moved faces' photos, unless
  allowDuplicates is set: a person can appear twice on a photo, for example on
  a photographed album page or a sheet of passport pictures.
  """
  moveImageFaces(
    imageFaceIDs: [ID!]!
    destinationFaceGroupID: ID!
    allowDuplicates: Boolean = false
  ): FaceGroup! @isAuthorized

  "Check the unconfirmed unlabeled faces against the confirmed faces of each person (a FaceGroup with a label or a confirmed face), and move them if a person matches"
  recognizeUnlabeledFaces: [ImageFace!]! @isAuthorized

  "Move a list of ImageFaces to a new face group"
  detachImageFaces(imageFaceIDs: [ID!]!): FaceGroup! @isAuthorized

  "Mark all faces on these photos as confirmed (or not); clears needsReview when confirming"
  setMediaFacesVerified(mediaIDs: [ID!]!, verified: Boolean!): [ImageFace!]! @isAuthorized

  "Mark single faces as confirmed (or not); clears needsReview when confirming"
  setImageFacesVerified(imageFaceIDs: [ID!]!, verified: Boolean!): [ImageFace!]! @isAuthorized

  """
  Assign the unverified faces of these groups again, using only verified faces as reference.
  With dryRun nothing is written and the result says what would happen.
  `tolerance` is compared with the squared distance between faces, as during a scan (default 0.2).
  """
  reclassifyFaceGroups(faceGroupIDs: [ID!]!, dryRun: Boolean!, tolerance: Float): ReclassifyResult! @isAuthorized
}
